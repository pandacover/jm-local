[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jm"
version = "0.1.0"
description = "Local atomic memory for chat sessions, exposed over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Luv" }]
dependencies = [
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jm = "jm.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
